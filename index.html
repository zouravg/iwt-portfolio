<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Student Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Chitkara Portal</a>
      <div class="navbar-nav">
        <a class="nav-link active" href="#">Home</a>
        <a class="nav-link" href="#">Courses</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row g-3">
      <!-- Profile Card -->
      <div class="col-md-5">
        <div class="card p-3">
          <h5>Student Profile</h5>
          <p><strong>Name:</strong> Gourav Kumar<br>
             <strong>Roll No:</strong> 2610990489<br>
             <strong>Email:</strong> gourav0489.becse26@chitkara.edu.in
          </p>
          <button class="btn btn-primary btn-sm">View Attendance</button>
        </div>
      </div>

      <!-- Simple Form -->
      <div class="col-md-7">
        <div class="card p-3">
          <h5>Leave Application</h5>
          <form>
            <div class="mb-2">
              <label class="form-label">Reason:</label>
              <input type="text" class="form-control" placeholder="Reason for leave">

            <button type="submit" class="btn btn-success btn-sm">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
